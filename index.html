<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodScape Pro - K-Pop Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            color:white;
            transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Smooth Mood Backgrounds */
        body.focused { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); }
        body.chill { background: linear-gradient(135deg, #00b4db, #0083b0); }
        body.hype { background: linear-gradient(135deg, #f80759, #bc4e9c); }
        body.sad { background: linear-gradient(135deg, #304352, #d7d2cc); }

        .container{
            width:100%;
            max-width:900px;
            text-align:center;
        }

        h1{
            font-size:3rem;
            margin-bottom:10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle{
            margin-bottom:20px;
            opacity:0.9;
            font-weight: 300;
        }

        #clock{
            font-size:1.4rem;
            font-weight:600;
            margin-bottom:25px;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .mood-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:15px;
            margin-bottom:25px;
        }

        .mood-btn{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            padding:15px;
            border-radius:15px;
            cursor:pointer;
            transition:0.3s;
            font-weight:600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mood-btn:hover{
            transform:translateY(-5px);
            background:rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .player-card{
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:20px;
            margin-bottom:20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        footer{
            margin-top:20px;
            opacity:0.8;
            font-size:0.9rem;
        }

        @media(max-width:768px){
            h1{ font-size:2rem; }
            iframe{ height:352px; }
        }
    </style>
</head>
<body class="focused">

<div class="container">
    <h1 id="title">Focused Mode 🎯</h1>
    <p class="subtitle">🎵 MoodScape Pro — K-Pop Edition</p>
    
    <div id="clock"></div>

    <div class="mood-grid">
        <div class="mood-btn" onclick="changeMood('focused')">🎯 Focused</div>
        <div class="mood-btn" onclick="changeMood('chill')">🌊 Chill</div>
        <div class="mood-btn" onclick="changeMood('hype')">🔥 Hype</div>
        <div class="mood-btn" onclick="changeMood('sad')">🌧️ Sad</div>
    </div>

    <div class="player-card">
        <!-- Default start with BTS -->
        <iframe
            id="clean-player"
            src="https://open.spotify.com/embed/artist/1SIocsqdEefUTE6XKGUiVS?utm_source=generator"
            width="100%"
            height="352"
            frameborder="0"
            allowfullscreen
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

    <footer>
        ✨ MoodScape Pro | Custom K-Pop Player
    </footer>
</div>

<script>
    // కేవలం లింకులు మాత్రమే ఉంటాయి, ఎర్రర్ వచ్చే టెక్స్ట్‌లు అన్నీ క్లీన్ చేసేశా!
    const moods = {
        focused: {
            title: "Focused Mode 🎯",
            playlist: "https://open.spotify.com/embed/artist/1SIocsqdEefUTE6XKGUiVS?utm_source=generator" // BTS
        },
        chill: {
            title: "Chill Mode 🌊",
            playlist: "https://open.spotify.com/embed/artist/41MozSoPIsD1dJM0CLPjZF?utm_source=generator" // Blackpink
        },
        hype: {
            title: "Hype Mode 🔥",
            playlist: "https://open.spotify.com/embed/artist/3Nrfpe0tUJi4K4DXYWgMUX?utm_source=generator" // BabyMonster
        },
        sad: {
            title: "Sad Mode 🌧️",
            playlist: "https://open.spotify.com/embed/playlist/4gyertnXGs2sSeUWOAKUP2?utm_source=generator" // Telugu Sad Playlist
        }
    };

    function changeMood(mood){
        document.body.className = mood;
        document.getElementById("title").innerText = moods[mood].title;
        
        // పక్కాగా ప్లేయర్ లింక్ మారిపోతుంది
        document.getElementById("clean-player").src = moods[mood].playlist;
    }

    function updateClock(){
        const now = new Date();
        document.getElementById("clock").innerHTML = "🕒 " + now.toLocaleTimeString();
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
